name: Android APK Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Pre-fetch Face Embedding Model
        run: |
          mkdir -p app/src/main/assets
          if [ ! -f "app/src/main/assets/mobilefacenet.tflite" ]; then
            echo "Attempting to download mobilefacenet.tflite..."
            curl -L --fail --connect-timeout 10 --max-time 30 \
              "https://raw.githubusercontent.com/sirius-ai/MobileFaceNet_TF/master/model/mobilefacenet.tflite" \
              -o app/src/main/assets/mobilefacenet.tflite || true
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: InstaGallery-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
