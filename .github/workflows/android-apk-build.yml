name: Android APK Build & Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_TAG: v1.1.0
  APK_FILENAME: InstaGallery-v1.1.0.apk

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$ANDROID_SDK_ROOT/licenses"
          printf "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n" > "$ANDROID_SDK_ROOT/licenses/android-sdk-preview-license"
          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager 2>/dev/null | head -n 1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure debug.keystore exists for signing
        run: |
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Download & Verify MobileFaceNet TFLite Model (>= 1 MB Gate)
        run: |
          mkdir -p app/src/main/assets
          MODEL_PATH="app/src/main/assets/mobilefacenet.tflite"
          MIRRORS=(
            "https://raw.githubusercontent.com/sirius-ai/MobileFaceNet_TF/master/arch/pretrained_model/mobilefacenet.tflite"
            "https://github.com/MCarlomagno/FaceRecognitionAuth/raw/master/assets/mobilefacenet.tflite"
            "https://huggingface.co/datasets/Xenova/tflite-models/resolve/main/mobilefacenet.tflite"
          )

          VERIFIED=0
          if [ -f "$MODEL_PATH" ]; then
            EXISTING_SIZE=$(stat -c%s "$MODEL_PATH" 2>/dev/null || echo 0)
            if [ "$EXISTING_SIZE" -ge 1000000 ]; then
              echo "Existing verified mobilefacenet.tflite found (${EXISTING_SIZE} bytes)."
              VERIFIED=1
            fi
          fi

          if [ "$VERIFIED" -eq 0 ]; then
            for URL in "${MIRRORS[@]}"; do
              echo "Attempting download from: $URL"
              rm -f "$MODEL_PATH"
              if curl -L --fail --retry 3 --connect-timeout 15 -o "$MODEL_PATH" "$URL"; then
                FILE_SIZE=$(stat -c%s "$MODEL_PATH" 2>/dev/null || echo 0)
                echo "Downloaded size: ${FILE_SIZE} bytes"
                if [ "$FILE_SIZE" -ge 1000000 ]; then
                  echo "Successfully verified mobilefacenet.tflite (${FILE_SIZE} bytes >= 1,000,000 bytes)."
                  VERIFIED=1
                  break
                else
                  echo "Rejected download (${FILE_SIZE} bytes < 1,000,000 bytes). Trying next mirror..."
                fi
              else
                echo "Mirror download failed: $URL"
              fi
            done
          fi

          if [ "$VERIFIED" -ne 1 ]; then
            echo "ERROR: Failed to obtain a valid mobilefacenet.tflite (>= 1 MB) from all mirrors!"
            exit 1
          fi
          ls -lh "$MODEL_PATH"

      - name: Clean Legacy WebP Icons & Build Optimized Signed Phone APK
        run: |
          rm -f app/src/main/res/mipmap-*/ic_launcher.webp app/src/main/res/mipmap-*/ic_launcher_round.webp
          gradle assembleDebug -PtargetPhonesOnly=true --stacktrace

      - name: Prepare Release APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/${APK_FILENAME}"
          ls -lh "dist/${APK_FILENAME}"

      - name: Remove Legacy Throttled Git-Tree APK Blob (if present)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          if git ls-files --error-unmatch releases/InstaGallery-v1.0.apk >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git rm -f releases/InstaGallery-v1.0.apk
            git commit -m "chore: remove large APK blob from git tree in favor of GitHub Releases CDN [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME} || true
          fi

      - name: Upload InstaGallery APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InstaGallery-v1.1.0-APK
          path: dist/${{ env.APK_FILENAME }}
          if-no-files-found: error

      - name: Publish Slim APK Package to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_SIZE=$(du -h "dist/${APK_FILENAME}" | cut -f1)
          cat << EOF > RELEASE_NOTES.md
          ## 📸 InstaGallery ${RELEASE_TAG} — Hybrid Two-Pass Anchor Face Recognition Engine & 3D Setup Carousel

          ### ⚡ Fast APK Download (\`${APK_SIZE}\` — Slim Optimized Build)
          - **Option 1 — Direct GitHub Release Asset**: Tap **\`${APK_FILENAME}\`** under **Assets** below.
          - **Option 2 — High-Speed Cloudflare CDN Mirror 1** *(Use this if GitHub downloads slowly on your mobile network)*:
            👉 **[⚡ Download via Cloudflare Mirror 1 (\`${APK_FILENAME}\`)](https://ghfast.top/https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${APK_FILENAME})**
          - **Option 3 — High-Speed Global Proxy Mirror 2**:
            👉 **[⚡ Download via Fast Mirror 2 (\`${APK_FILENAME}\`)](https://gh-proxy.com/https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${APK_FILENAME})**

          ### 📲 Installation Steps
          1. Download **\`${APK_FILENAME}\`** on your Android 8.0+ (API 26+) phone.
          2. Open the \`.apk\` file and allow *Install unknown apps* if prompted.
          3. Launch **InstaGallery** — the upgraded Room v3 schema automatically resets legacy fragmented clusters and runs the new Two-Pass Anchor Face Recognition pipeline.

          ### 🧠 What's New in ${RELEASE_TAG}
          - **CI Neural Model Lock (\`mobilefacenet.tflite\` >= 1 MB Gate)**: Multi-mirror download with hard file-size verification and bundled native \`org.tensorflow.lite.Interpreter\` runtime (4 threads) + dynamic tensor shape & DataType inspection.
          - **ML Kit \`PERFORMANCE_MODE_ACCURATE\` + 2D Affine Eye Alignment**:
            - High-resolution \`1600px\` EXIF-normalized photo decoding (\`setMinFaceSize(0.045f)\` for group photos).
            - Strict 5-landmark false-positive filter rejecting screenshots, memes, and invalid geometry.
            - 2D affine eye-alignment rotation (\`postRotate(-angleDegrees, eyeCenterX, eyeCenterY)\`) producing upright \`112x112\` neural crops and \`180x180\` portrait avatars.
            - 4-frame video Reel sampling (\`20%\`, \`45%\`, \`70%\`, \`85%\`) with cross-frame spatial deduplication.
          - **Flip-Augmented Embeddings & Two-Pass Multi-Prototype k-NN Clustering**:
            - Test-time horizontal flip augmentation ($\hat{v}_{\text{final}} = \text{norm}(\hat{v}_1 + \hat{v}_2)$) eliminating lighting and yaw asymmetry.
            - Multi-prototype matching across up to 12 anchor exemplars per person (\`0.55 * maxExemplar + 0.30 * top3Avg + 0.15 * centroid\`).
            - **Pass 1 (Strict Anchor Gate)** + **Pass 2 (Graph Consolidation & Live User-Anchor k-NN Re-Sweep)** that automatically pulls side-angle and unassigned faces into named profiles like \`@Papa\` and \`@Maa\`.
          - **Interactive 3D Horizontal Carousel Setup (\`ProfileSetupScreen\`)**, **Radial Halo Processing Screen**, and **Choreographed Stitch Welcome Screen**.
          EOF

          git tag -f "${RELEASE_TAG}"
          git push origin "${RELEASE_TAG}" --force

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "dist/${APK_FILENAME}" --clobber
            gh release edit "${RELEASE_TAG}" \
              --title "InstaGallery ${RELEASE_TAG} — Two-Pass Anchor Face Engine APK (${APK_SIZE})" \
              --notes-file RELEASE_NOTES.md \
              --latest
          else
            gh release create "${RELEASE_TAG}" "dist/${APK_FILENAME}" \
              --title "InstaGallery ${RELEASE_TAG} — Two-Pass Anchor Face Engine APK (${APK_SIZE})" \
              --notes-file RELEASE_NOTES.md \
              --latest
          fi
          rm -f RELEASE_NOTES.md
