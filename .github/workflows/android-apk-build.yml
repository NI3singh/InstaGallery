name: Android APK Build & Release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_TAG: v2.0.0
  APK_FILENAME: InstaGallery-v2.0.0.apk

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$ANDROID_SDK_ROOT/licenses"
          printf "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n" > "$ANDROID_SDK_ROOT/licenses/android-sdk-preview-license"
          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager 2>/dev/null | head -n 1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure debug.keystore exists for signing
        run: |
          if [ ! -f "debug.keystore" ]; then
            if [ ! -f "debug.keystore.base64" ]; then
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            else
              base64 -d debug.keystore.base64 > debug.keystore
            fi
          fi

      - name: Verify or Download MobileFaceNet TFLite Model
        run: |
          mkdir -p app/src/main/assets
          SUCCESS=0
          if [ -f app/src/main/assets/mobilefacenet.tflite ]; then
            SIZE=$(stat -c%s app/src/main/assets/mobilefacenet.tflite 2>/dev/null || wc -c < app/src/main/assets/mobilefacenet.tflite)
            if [ "$SIZE" -ge 1000000 ]; then
              echo "Verified bundled mobilefacenet.tflite ($SIZE bytes)"
              SUCCESS=1
            fi
          fi
          if [ "$SUCCESS" -ne 1 ]; then
            URLS=(
              "https://raw.githubusercontent.com/MCarlomagno/FaceRecognitionAuth/master/assets/mobilefacenet.tflite"
              "https://raw.githubusercontent.com/kuru0777/face-recognition-with-flutter/main/assets/mobilefacenet.tflite"
              "https://raw.githubusercontent.com/ngtrphuong/facerecognition/master/assets/mobilefacenet.tflite"
            )
            for url in "${URLS[@]}"; do
              echo "Trying $url ..."
              curl -L --fail --retry 3 --connect-timeout 15 -o app/src/main/assets/mobilefacenet.tflite "$url" || true
              if [ -f app/src/main/assets/mobilefacenet.tflite ]; then
                SIZE=$(stat -c%s app/src/main/assets/mobilefacenet.tflite 2>/dev/null || wc -c < app/src/main/assets/mobilefacenet.tflite)
                if [ "$SIZE" -ge 1000000 ]; then
                  echo "Verified downloaded mobilefacenet.tflite ($SIZE bytes)"
                  SUCCESS=1
                  break
                fi
              fi
            done
          fi
          if [ "$SUCCESS" -ne 1 ]; then
            echo "ERROR: Failed to verify valid mobilefacenet.tflite"
            exit 1
          fi

      - name: Clean Legacy WebP Icons & Build Optimized Signed Phone APK
        run: |
          rm -f app/src/main/res/mipmap-*/ic_launcher.webp app/src/main/res/mipmap-*/ic_launcher_round.webp
          gradle assembleDebug -PtargetPhonesOnly=true --stacktrace

      - name: Prepare Release APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/${APK_FILENAME}"
          ls -lh "dist/${APK_FILENAME}"

      - name: Remove Legacy Throttled Git-Tree APK Blob (if present)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          if git ls-files --error-unmatch releases/InstaGallery-v1.0.apk >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git rm -f releases/InstaGallery-v1.0.apk
            git commit -m "chore: remove large APK blob from git tree in favor of GitHub Releases CDN [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME} || true
          fi

      - name: Upload InstaGallery APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InstaGallery-v2.0.0-APK
          path: dist/${{ env.APK_FILENAME }}
          if-no-files-found: error

      - name: Publish Slim APK Package to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_SIZE=$(du -h "dist/${APK_FILENAME}" | cut -f1)
          cat << EOF > RELEASE_NOTES.md
          ## 🚀 InstaGallery ${RELEASE_TAG} — Interactive Story Player, 1080p InstaCard Studio, Saved Collections & Relational Co-Occurrence Graph

          ### ⚡ Fast APK Download (\`${APK_SIZE}\` — Slim Optimized Build)
          - **Option 1 — Direct GitHub Release Asset**: Tap **\`${APK_FILENAME}\`** under **Assets** below.
          - **Option 2 — High-Speed Cloudflare CDN Mirror 1** *(Use this if GitHub downloads slowly on your mobile network)*:
            👉 **[⚡ Download via Cloudflare Mirror 1 (\`${APK_FILENAME}\`)](https://ghfast.top/https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${APK_FILENAME})**
          - **Option 3 — High-Speed Global Proxy Mirror 2**:
            👉 **[⚡ Download via Fast Mirror 2 (\`${APK_FILENAME}\`)](https://gh-proxy.com/https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${APK_FILENAME})**

          ### 📲 Installation Steps
          1. Download **\`${APK_FILENAME}\`** on your Android 8.0+ (API 26+) phone.
          2. Open the \`.apk\` file and allow *Install unknown apps* if prompted.
          3. Launch **InstaGallery** — all existing faces, profiles, captions, and bookmarks upgrade automatically via non-destructive SQLite migrations.

          ### ✨ What's New in ${RELEASE_TAG}
          - **Full-Screen Interactive Story Player (\`StoryPlayerScreen\`)**:
            - Smart 12-slide curation per person (*On This Day* flashbacks, *Favorite Memories*, and *Recent Captures*) with segmented 4.5s auto-advancing progress bars, subtle Ken Burns motion, tap left/right navigation, stationary press-and-hold pause with HUD fade-out, and swipe-down dismiss.
          - **InstaCard 1080p Snapshot Studio (\`InstaCardStudio\`)**:
            - Export and share razor-sharp \`1080p\` social cards in 3 templates (*OLED Dark*, *Ambient Glass*, and *Polaroid EXIF*) directly to \`Pictures/InstaGallery_Cards\` or the Android share sheet.
          - **"Together With" Co-Occurrence & Solo Portrait Filters**:
            - Filter any person's profile grid by *All Photos*, *Solo* portraits, or co-occurring duo photos (*Together With @PersonB*) powered by SQLite self-joins on \`media_person_cross_ref\`.
          - **Interactive Collab Post Headers**:
            - Overlapping dual avatars and \`@PersonA & @PersonB\` collab attribution on group photos with a 1-tap \`CollabAuthorsSheet\` to jump to any co-star's profile.
          - **Instagram-Style Saved Collections Boards (\`SavedCollectionsScreen\`)**:
            - Organize bookmarked memories into custom local boards (*Favorites & Highlights*, *Trips & Outings*, *Family & Friends*, *Wallpapers*, plus custom boards) with \`2x2\` mosaic covers, 3-column grid / vertical feed toggle, and instant real-time SQLite synchronization.
          - **Native Instagram Dark Mode Captions, EXIF Inspector & Custom Heart Themes**:
            - Add personal captions that replace raw camera filenames, inspect camera/lens/ISO metadata and tag people in 1 tap from the \`⋮\` sheet, and customize double-tap heart burst physics with 6 color themes.
          EOF

          git tag -f "${RELEASE_TAG}"
          git push origin "${RELEASE_TAG}" --force

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "dist/${APK_FILENAME}" --clobber
            gh release edit "${RELEASE_TAG}" \
              --title "InstaGallery ${RELEASE_TAG} — Stories, 1080p InstaCard Studio, Saved Collections & Co-Occurrence Graph (${APK_SIZE})" \
              --notes-file RELEASE_NOTES.md \
              --latest
          else
            gh release create "${RELEASE_TAG}" "dist/${APK_FILENAME}" \
              --title "InstaGallery ${RELEASE_TAG} — Stories, 1080p InstaCard Studio, Saved Collections & Co-Occurrence Graph (${APK_SIZE})" \
              --notes-file RELEASE_NOTES.md \
              --latest
          fi
          rm -f RELEASE_NOTES.md
